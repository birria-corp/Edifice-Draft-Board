import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyCrTmJNohK-7_t2BHx70HA6AfLmZyryLUY",authDomain:"zeptrack-f8720.firebaseapp.com",projectId:"zeptrack-f8720",storageBucket:"zeptrack-f8720.firebasestorage.app",messagingSenderId:"791166858370",appId:"1:791166858370:web:9ccf77cdad85cb3689b09b"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();
window._signIn=async()=>{try{await signInWithPopup(auth,provider)}catch(e){console.error(e)}};
window._signOut=async()=>{try{await signOut(auth)}catch(e){console.error(e)}};
window._syncNow=async()=>{const u=window._authUser;if(!u)return;await runSync(u.uid)};
async function runSync(uid){
  const ref=doc(db,'users',uid,'data','EDB_state');
  const local=localStorage.getItem('EDB_state');
  try{
    const snap=await getDoc(ref);
    if(snap.exists()){
      const remote=snap.data().payload;
      if(remote&&remote!==local){
        const rl=JSON.parse(remote),ll=local?JSON.parse(local):null;
        const rt=rl?.ts||0,lt=ll?.ts||0;
        if(rt>lt){
          const use=confirm('Cloud save is newer. Load cloud version?\n\nOK = Load cloud  |  Cancel = Keep local');
          if(use){localStorage.setItem('EDB_state',remote);if(window._reloadAppState)window._reloadAppState();window._showToast&&window._showToast('Loaded cloud save');return}
        }
      }
    }
    const payload=local||JSON.stringify({});
    await setDoc(ref,{payload});
    window._showToast&&window._showToast('Synced to cloud');
  }catch(e){console.error(e);window._showToast&&window._showToast('Sync failed')}
}
onAuthStateChanged(auth,user=>{
  window._authUser=user||null;
  document.dispatchEvent(new CustomEvent('authChanged'));
  if(user)runSync(user.uid);
});
</script>

<script>
const APP_VERSION='1.0';
const LS_STATE='EDB_state';
const LS_FS='EDB_fontsize';
const LS_EXPORT='EDB_lastexport';
const FS_STEPS=[75,85,92,100,108,116,125,135,146,158];
let fsIdx=Number(localStorage.getItem(LS_FS)||3);

function applyFont(){document.documentElement.style.fontSize=FS_STEPS[fsIdx]+'%'}
applyFont();

window._fsDown=()=>{if(fsIdx>0){fsIdx--;localStorage.setItem(LS_FS,fsIdx);applyFont()}};
window._fsUp=()=>{if(fsIdx<FS_STEPS.length-1){fsIdx++;localStorage.setItem(LS_FS,fsIdx);applyFont()}};

window._showToast=function(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)};

window._openSettings=()=>{document.getElementById('settingsModal').classList.add('open')};
window._closeSettings=()=>{document.getElementById('settingsModal').classList.remove('open')};
window._triggerImport=()=>{window._closeSettings();document.getElementById('file').click()};

window._checkVersion=async()=>{
  try{
    const r=await fetch('version.json?_='+Date.now());
    const d=await r.json();
    if(d.version===APP_VERSION)window._showToast('Up to date (v'+APP_VERSION+')');
    else window._showToast('Update available: v'+d.version+' (current: v'+APP_VERSION+')');
  }catch{window._showToast('Version check failed')}
};

window._exportData=function(){
  const blob=new Blob([JSON.stringify({state,settings,history},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='edifice-draft-board-v'+APP_VERSION+'.json';
  a.click();
  localStorage.setItem(LS_EXPORT,Date.now());
  window._showToast('Exported');
};

function checkAutoExport(){
  const last=Number(localStorage.getItem(LS_EXPORT)||0);
  if(Date.now()-last>4*24*60*60*1000)window._exportData();
}

  if(u){

    el.innerHTML='<button onclick="window._signIn()">Sign in with Google</button>';
  }
}
document.addEventListener('authChanged',()=>renderTopbar());
window._reloadAppState=function(){
  try{
    const raw=localStorage.getItem(LS_STATE);

    const saved=JSON.parse(raw);
    if(saved?.state){
      state=saved.state;
      settings={...settings,...saved.settings,scoring:{...DEFAULT_SCORING,...saved.settings?.scoring}};
      history=saved.history||[];

    draw();
    window._showToast('State refreshed from cloud');

};

const POS=['All','C','1B','2B','3B','SS','OF','DH','U','SP','RP'];
const ACTIVE=['C','1B','2B','3B','SS','OF1','OF2','OF3','DH','U','SP1','SP2','SP3','SP4','RP1','RP2'];
const HITTER=['C','1B','2B','3B','SS','OF','DH'];
const DEFAULT_SCORING={single:1,double:2,triple:3,bb:1,ci:1,cs:-1,csc:1,cycle:5,error:-1,gdp:-1,hbp:1,hr:4,ibb:.5,ko:-1,ofast:1,r:1,rbi:1,sb:1,sh:.3,balk:-.5,bs:-4,cg:8,er:-1,hold:2,inn:1,irs:-.5,k:.5,loss:-5,nh:10,pg:15,qs:4,save:4,shutout:3,winSp:8,winRp:4,wp:-.5};

try{

  if(saved?.state){
    state=saved.state;

// ---- Utilities ----
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>'$'+Number(x||0).toLocaleString();
const idd=p=>encodeURIComponent(p.name);
const getp=n=>state.find(p=>p.name===decodeURIComponent(n));
const avail=()=>state.filter(p=>p.status!=='Taken'&&p.status!=='Picked');
const roster=()=>state.filter(p=>p.status==='Picked');
const keepers=()=>roster().filter(p=>p.keeper);
const keeperTotal=()=>keepers().reduce((a,p)=>a+Number(p.salary||0),0);
const draftBudget=()=>Number(settings.totalBudget)-Number(settings.trades)-keeperTotal();
const spent=()=>roster().filter(p=>!p.keeper).reduce((a,p)=>a+Number(p.salary||0),0);
const saveState=()=>{
  const payload=JSON.stringify({state,settings,history,ts:Date.now()});
  localStorage.setItem(LS_STATE,payload);
};

function snap(){history.push(JSON.stringify({state,settings}));if(history.length>1)history.shift()}
function undo(){if(!history.length)return;const last=JSON.parse(history.pop());state=last.state;settings=last.settings;saveState();draw()}
function eligible(p,pos){if(pos==='All')return true;if(pos==='U')return p.eligible.some(x=>HITTER.includes(x));return p.eligible.includes(pos)}
function slotsFor(p){let a=[];for(const s of ACTIVE){const pos=s.replace(/[0-9]/g,'');if(eligible(p,pos))a.push(s)}return a}
function firstOpenSlot(p){return slotsFor(p).find(s=>!roster().some(x=>x.slot===s))||'RES'}

function action(kind,n){
  const p=getp(n);if(!p)return;snap();
  if(kind==='take')p.status='Taken';
  if(kind==='pick'){
    if(roster().length>=22){history.pop();alert('Roster is at its 22-player maximum.');return}
    p.status='Picked';p.salary=p.salary??0;p.slot=firstOpenSlot(p);p.pickOrder=Date.now();
  }
  saveState();draw();
}

function header(){
  document.getElementById('budget').textContent=money(draftBudget()-spent());
  document.getElementById('count').textContent=roster().length+' / 22';
  document.getElementById('slots').textContent=22-roster().length;
  document.getElementById('shown').textContent=avail().length;
  document.getElementById('tabs').innerHTML=
    '<button class="tab '+(tab==='board'?'active':'')+'" data-tab="board">Draft Board</button>'+
    '<button class="tab '+(tab==='settings'?'active':'')+'" data-tab="settings">League Settings</button>'+

}

  return '<div class="panel"><h2>'+title+'</h2><div class="tablewrap"><table><thead><tr>'+

    '<th class="sort" data-sort="name">Player</th>'+

    '<th class="sort money" data-sort="max">Max $</th><th>Action</th></tr></thead><tbody>'+
    list.map(p=>
      '<tr><td class="rank">'+p.rank+'</td>'+
      '<td><b>'+esc(p.name)+'</b></td>'+

      '<td>'+(p.sleeper?'<span class="zzz">ZZZ</span>':'--')+'</td>'+
      '<td class="money">'+money(p.max)+'</td>'+
      '<td>'+buttons(p)+'</td></tr>'
    ).join('')+'</tbody></table></div></div>';
}

function board(){
  if(view==='sleepers')return picker()+playerTable(avail().filter(p=>p.sleeper).sort((a,b)=>b.max-a.max),'Available Consensus Sleepers');
  if(view==='best')return picker()+best();
  if(view==='roster')return picker()+rosterView();
  const list=avail().filter(p=>eligible(p,filter)).sort((a,b)=>typeof a[sort]==='string'?a[sort].localeCompare(b[sort])*dir:(Number(a[sort])-Number(b[sort]))*dir);
  return picker()+playerTable(list,filter==='All'?'All Players - Suggested Max $':filter+' Eligible Players - Suggested Max $');
}

function best(){
  return '<div class="best-grid">'+POS.slice(1).filter(p=>p!=='U').map(pos=>{
    const top=avail().filter(p=>eligible(p,pos)).sort((a,b)=>b.max-a.max).slice(0,3);
    return '<div class="panel best-card"><h3>'+pos+'</h3>'+
      top.map(p=>'<div class="best-row"><b>'+esc(p.name)+'</b>'+(p.sleeper?'<span class="zzz">ZZZ</span>':'')+
        '<small>'+esc(p.eligible.join('/'))+'  '+esc(p.team)+'  '+money(p.max)+'</small>'+buttons(p)+'</div>').join('')+'</div>';
  }).join('')+'</div>';
}

function rosterView(){
  const bySlot=Object.fromEntries(ACTIVE.map(s=>[s,[]]));
  const reserves=[];
  for(const p of roster()){if(ACTIVE.includes(p.slot))bySlot[p.slot].push(p);else reserves.push(p)}
  const line=(label,items)=>'<div class="slot"><b>'+label+'</b>'+
    items.map(p=>'<div><b>'+esc(p.name)+'</b><small>'+esc(p.eligible.join('/'))+'  '+esc(p.team)+'  '+money(p.salary)+'</small>'+slotSelect(p)+'</div>').join('')+
    (items.length?'':'<div class="empty">Open slot</div>')+'</div>';
  const active=ACTIVE.map(s=>line(s,bySlot[s])).join('');
  return '<div class="layout">'+
    '<div class="panel"><h2>Active Lineup (16)</h2><div class="inside">'+active+'</div></div>'+
    '<div class="panel"><h2>Reserves (6)</h2><div class="inside">'+
    reserves.map(p=>'<div class="slot"><b>'+esc(p.name)+'</b><small>'+esc(p.eligible.join('/'))+'  '+esc(p.team)+'  '+money(p.salary)+'</small>'+slotSelect(p)+'</div>').join('')+
    (reserves.length?'<p class="help">Move a player to an eligible active slot when ready.</p>':'<p class="empty">Open reserve slots</p>')+
    '</div></div></div>';
}

function slotSelect(p){
  const opts=['RES',...slotsFor(p)];
  return '<select data-slot="'+idd(p)+'">'+opts.map(s=>'<option value="'+s+'" '+(p.slot===s?'selected':'')+'>'+(s==='RES'?'Reserve':s)+'</option>').join('')+'</select>'+

}

function buildPrompt(){
  const scoring=SCORE_LABELS.map(([k,l])=>'- '+l+': '+settings.scoring[k]).join('\n');

  return 'Build a comprehensive '+settings.season+' MLB player board for Edifice Draft Board. Research the latest available expert consensus rankings, points-league projections, $225 auction values, spring training or current-season depth charts, confirmed roles, injuries, and closer situations. Prefer cross-checking FantasyPros, Fantrax, RotoWire, ESPN, CBS Sports, NFBC/ADP data, Statcast, and official MLB team news. Rank for this exact head-to-head weekly points system, not roto or 5x5.\n\nLEAGUE: 12 teams; $'+settings.totalBudget+' total budget; trades '+settings.trades+' (positive cash sent, negative received); keeper salaries $'+keeperTotal()+'; draft budget $'+draftBudget()+'; roster 22 total = 16 active + 6 reserves. Active slots: C, 1B, 2B, 3B, SS, 3 OF, DH, U (hitter only), 4 SP, 2 RP. Eligibility: hitters use primary position plus 20 games last year or 5 games this year; SP requires 5 starts last year/this year; RP requires 10 relief appearances last year/this year. Player pool: all MLB AL/NL players. Keepers: '+k+'.\n\nSCORING:\n'+scoring+'\n\nVALUES: base is an integer neutral-market $225 auction estimate. max is the recommended integer maximum bid under this exact scoring and current draft budget. Give extra weight to walks, runs/RBI, total bases, innings, wins, quality starts, saves, holds, and the separate SP/RP win values.\n\nCOMPLETENESS: Return at least 375 meaningful draft candidates, including MLB regulars, closers, setup relievers with holds paths, starting pitchers, prospects with plausible 2026 impact, injured-return candidates, handcuffs, and upside reserves. Each player must list primaryPos and all current eligible positions.\n\nSLEEPERS: Identify consensus sleeper/value selections from credible current sources: ideally 8-15 hitters and 8-15 pitchers/relievers. Set sleeper:true only for consensus sleepers.\n\nOUTPUT: JSON only, no Markdown or commentary. Exact schema: {"season":'+settings.season+',"players":[{"rank":1,"name":"Player Name","primaryPos":"OF","eligible":["OF"],"team":"ABC","base":42,"max":48,"sleeper":false,"notes":"Brief role/injury/eligibility note."}]}. Valid positions: C,1B,2B,3B,SS,OF,DH,SP,RP. rank/base/max must be integers; max >= base; ranks must be unique and consecutive from 1; no duplicate player names; use three-letter MLB team abbreviations. Silently validate before returning.';
}

function normalize(data){
  const a=Array.isArray(data)?data:data?.players;
  if(!Array.isArray(a)||!a.length)throw Error('JSON needs a non-empty players array.');
  const ranks=new Set(),names=new Set();
  return a.map((x,i)=>{
    const eligible=Array.isArray(x.eligible)?x.eligible.map(String):[String(x.primaryPos||x.pos||'').toUpperCase()];
    const primary=String(x.primaryPos||x.pos||eligible[0]).toUpperCase();
    if(!x.name||!['C','1B','2B','3B','SS','OF','DH','SP','RP'].includes(primary)||!eligible.length||eligible.some(p=>!['C','1B','2B','3B','SS','OF','DH','SP','RP'].includes(p)))throw Error('Invalid name or position for player '+(i+1));
    const rank=Number(x.rank);
    if(!Number.isInteger(rank)||ranks.has(rank))throw Error('Ranks must be unique integers.');
    ranks.add(rank);
    if(names.has(x.name))throw Error('Duplicate player name: '+x.name);
    names.add(x.name);
    const base=Number(x.base),max=Number(x.max);
    if(!Number.isInteger(base)||!Number.isInteger(max)||max<base)throw Error('base/max must be integers and max >= base.');
    return{rank,name:String(x.name),primaryPos:primary,eligible,team:String(x.team||''),base,max,sleeper:!!x.sleeper,notes:String(x.notes||''),status:'Available',salary:null,keeper:false,slot:'RES'};
  });
}

function draw(){header();document.getElementById('view').innerHTML=tab==='board'?board():settingsView()}

function importData(text){
  try{
    const x=normalize(JSON.parse(text));snap();state=x;history=[];saveState();tab='board';view='players';draw();
    alert('Imported '+x.length+' players.');
  }catch(e){alert('Import failed: '+e.message)}
}

  const h=e.target.closest('[data-sort]');
  if(h){const s=h.dataset.sort;dir=sort===s?-dir:-1;sort=s;draw();return}
  const b=e.target.closest('button');
  if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;draw();return}
  if(b.dataset.filter){filter=b.dataset.filter;view='players';draw();return}
  if(b.dataset.action==='take')action('take',b.dataset.name);
  if(b.dataset.action==='pick')action('pick',b.dataset.name);
  if(b.dataset.action==='undo')undo();
  if(b.dataset.action==='sleepers'){view='sleepers';tab='board';draw()}
  if(b.dataset.action==='best'){view='best';tab='board';draw()}
  if(b.dataset.action==='roster'){view='roster';tab='board';draw()}
  if(b.dataset.action==='reset'&&confirm('Reset draft and restore the sample board?')){state=structuredClone(SAMPLE);history=[];saveState();tab='board';view='players';draw()}
  if(b.dataset.action==='addK'){snap();state.push({rank:9999,name:'New Keeper '+state.length,primaryPos:'OF',eligible:['OF'],team:'TBD',base:0,max:0,sleeper:false,notes:'Keeper--already rostered; do not nominate.',status:'Picked',salary:0,keeper:true,slot:'RES'});saveState();draw()}
  if(b.dataset.action==='removeK'){snap();const p=getp(b.dataset.name);p.keeper=false;p.status='Available';p.salary=null;p.slot='RES';saveState();draw()}
  if(b.dataset.action==='import')importData(document.getElementById('json').value);
  if(b.dataset.action==='choose')document.getElementById('file').click();
  if(b.dataset.action==='export'){
    const text=buildPrompt();
    document.getElementById('promptbox').value=text;
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
    a.download='edifice-draft-board-prompt.txt';a.click();
  }
  if(b.dataset.action==='copy'){
    const text=buildPrompt();
    const box=document.getElementById('promptbox');box.value=text;box.focus();box.select();
    navigator.clipboard?.writeText(text).catch(()=>document.execCommand('copy'));
  }
});

document.addEventListener('change',e=>{
  if(e.target.dataset.salary){snap();getp(e.target.dataset.salary).salary=Number(e.target.value)||0;saveState();draw()}
  if(e.target.dataset.slot){
    const p=getp(e.target.dataset.slot),slot=e.target.value;
    if(slot!=='RES'&&roster().some(x=>x!==p&&x.slot===slot)){alert(slot+' is already occupied.');draw();return}
    snap();p.slot=slot;saveState();draw();
  }
  if(e.target.dataset.setting){snap();settings[e.target.dataset.setting]=Number(e.target.value)||0;saveState();draw()}
  if(e.target.dataset.score){snap();settings.scoring[e.target.dataset.score]=Number(e.target.value)||0;saveState();draw()}
  if(e.target.dataset.kfield){snap();const p=getp(e.target.dataset.name);p[e.target.dataset.kfield]=e.target.value;if(e.target.dataset.kfield==='primaryPos'&&!p.eligible.includes(e.target.value))p.eligible=[e.target.value];saveState();draw()}
  if(e.target.id==='file'&&e.target.files[0]){const r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(e.target.files[0])}
});

// ---- Init ----
document.getElementById('versionLabel').textContent=APP_VERSION;
renderTopbar();
draw();
checkAutoExport();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
