<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="#08130e"/>
  <!-- Grass field base -->
  <ellipse cx="96" cy="152" rx="72" ry="18" fill="#163323" opacity="0.8"/>
  <!-- Diamond lines -->
  <polygon points="96,60 132,96 96,132 60,96" fill="none" stroke="#42c86c" stroke-width="2" opacity="0.7"/>
  <!-- Base paths -->
  <line x1="96" y1="60" x2="132" y2="96" stroke="#efc85a" stroke-width="1.5" opacity="0.6"/>
  <line x1="132" y1="96" x2="96" y2="132" stroke="#efc85a" stroke-width="1.5" opacity="0.6"/>
  <line x1="96" y1="132" x2="60" y2="96" stroke="#efc85a" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="96" x2="96" y2="60" stroke="#efc85a" stroke-width="1.5" opacity="0.6"/>
  <!-- Bases -->
  <rect x="90" y="54" width="12" height="12" rx="2" fill="#efc85a" opacity="0.9" transform="rotate(45,96,60)"/>
  <rect x="126" y="90" width="12" height="12" rx="2" fill="#efc85a" opacity="0.9" transform="rotate(45,132,96)"/>
  <rect x="90" y="126" width="12" height="12" rx="2" fill="#efc85a" opacity="0.9" transform="rotate(45,96,132)"/>
  <rect x="54" y="90" width="12" height="12" rx="2" fill="#efc85a" opacity="0.9" transform="rotate(45,60,96)"/>
  <!-- Home plate -->
  <polygon points="96,136 104,144 104,152 88,152 88,144" fill="#f1fff5" opacity="0.9"/>
  <!-- Pitcher's mound -->
  <circle cx="96" cy="96" r="5" fill="#315742" stroke="#42c86c" stroke-width="1.5"/>
  <!-- Baseball -->
  <circle cx="148" cy="42" r="10" fill="#f1fff5" stroke="#e0d5c0" stroke-width="1"/>
  <!-- Baseball stitches -->
  <path d="M144,38 C145,36 147,36 148,38 C149,40 151,40 152,38" fill="none" stroke="#ef6a72" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M144,46 C145,44 147,44 148,46 C149,48 151,48 152,46" fill="none" stroke="#ef6a72" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="28" cy="30" r="1.5" fill="#f1fff5" opacity="0.6"/>
  <circle cx="165" cy="25" r="1" fill="#f1fff5" opacity="0.5"/>
  <circle cx="172" cy="70" r="1.5" fill="#f1fff5" opacity="0.7"/>
  <circle cx="20" cy="110" r="1" fill="#f1fff5" opacity="0.5"/>
</svg>
